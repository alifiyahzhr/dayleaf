<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="referrer" content="no-referrer">
  <title>dayleaf</title>
  <meta name="description" content="A calm personal workspace: daily entries, habits, projects and goals — all connected.">
  <link rel="icon" href="assets/mascot.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/mascot.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="locked">
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="scrim" data-act="nav-close"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main"><div class="view" id="view"></div></main>
    </div>
    <button class="focus-exit" data-act="focus-toggle" aria-label="Exit focus mode">Exit focus &middot; Esc</button>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="lock" class="lock" hidden role="dialog" aria-modal="true" aria-label="Unlock dayleaf"></div>
  <input type="file" id="photo-file" accept="image/*" hidden>
  <input type="file" id="banner-file" accept="image/*" hidden>
  <input type="file" id="restore-file" accept=".json,application/json" hidden>
  <div id="buddy" class="mascot visitor" data-act="mascot-poke" role="button" tabindex="0" aria-label="Mif the bunny" hidden></div>

  <script src="js/utils.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/store.js"></script>
  <script src="js/security.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/board.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/views.js"></script>
  <script src="js/views2.js"></script>
  <script src="js/views3.js"></script>
  <script src="js/school.js"></script>
  <script src="js/dapukan.js"></script>
  <script src="js/journals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
